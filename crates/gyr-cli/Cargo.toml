[package]
name = "gyr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "gyr"
path = "src/main.rs"

# The Linux sandbox helper ships from here rather than its own crate so that one
# `cargo install` produces a working agent. RFC-0009 section 5.1 argued for a
# helper *process* over in-process unsafe; which crate builds it is packaging.
[[bin]]
name = "gyr-confine"
path = "src/bin/gyr-confine.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
gyr-core.workspace = true
gyr-eval.workspace = true
gyr-exec.workspace = true
gyr-model.workspace = true
gyr-protocol.workspace = true
gyr-rust.workspace = true
gyr-sandbox.workspace = true
gyr-tools.workspace = true
rustyline.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[lints]
workspace = true
