[workspace]
members = [
    "crates/gyr-cli",
    "crates/gyr-core",
    "crates/gyr-model",
    "crates/gyr-protocol",
    "crates/gyr-rust",
    "crates/gyr-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cargopete/gyrfalcon"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
clap = { version = "4.5.51", features = ["derive"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
gyr-core = { path = "crates/gyr-core" }
gyr-model = { path = "crates/gyr-model" }
gyr-protocol = { path = "crates/gyr-protocol" }
gyr-rust = { path = "crates/gyr-rust" }
gyr-tools = { path = "crates/gyr-tools" }
ignore = "0.4.33"
pretty_assertions = "1.4.1"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.17"
tokio-util = { version = "0.7.17", default-features = false }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
